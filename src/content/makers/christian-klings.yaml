doc_heading: Christian Klings
body: |-
  Klings is almost a perfect example of the forgotten independent master.

  He works essentially alone, designing on paper and manually producing plates, bridges, wheels, cases, crowns, dials, springs and steelwork. His career has included 10-second tourbillons, experimental detent escapements and bespoke time-only watches.

  This is real experimental escapement watchmaking, not marketing language.
  Why under-collected: extremely low visibility and commission-driven production.
  Movement-first ranking: exceptionally high.
