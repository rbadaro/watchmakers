doc_heading: Felipe Pikullik
body: |-
  Pikullik's positioning changed materially in 2025–26.

  Earlier watches often centred on extreme finishing of existing movement architectures. The FPMP2 and especially the newer FPA1 move him decisively toward proprietary manufacture.

  The current work includes a handmade balance, although specialist regulating components remain externally sourced.

  Important collector distinction: current FPA1 watches are relatively accessible and not tightly numerically limited. That makes Pikullik less of an allocation hunt and more of an unusually compelling value proposition.
