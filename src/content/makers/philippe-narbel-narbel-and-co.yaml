doc_heading: Philippe Narbel / Narbel & Co
body: |-
  Philippe Narbel spent a career inside the highest end of movement decoration, most notably as a skeletonizer at Audemars Piguet, before founding Narbel & Co with his family. His independent profile rose with a Louis Vuitton Watch Prize semifinalist slot in 2024, and his bones run deeper than most new independents because his atelier, Manufactor, also supplies movement finishing to other brands on this list, including Sartory-Billard. Former apprentice Annelinde Dunselman spreads the lineage further.

  His own watches start from the hand-wound Peseux 7001, a vintage specialist movement, and rework it so extensively that the original plate is unrecognizable: new architecture, fully openworked by hand, and in the Full Rotor version reconfigured with an automatic winding system of his own design. Casework and dials happen in the same atelier. The distinction is that the underlying gear train began life at Peseux, so this is manufacture by transformation, as with early Atelier de Chronométrie.

  Why Tier D and A3 / M4: nobody on this list out-decorates him and the workshop genuinely makes the cases, dials and architecture surrounds; the supplied base is what holds authorship at A3. The movement ecosystem role is a bonus for the thesis: when an atelier gets trusted to finish for other movement-makers, the craft standing is established upstream of any prize. Tier C waits on a calibre of his own design, which the manufacturing depth already suggests is within range.
