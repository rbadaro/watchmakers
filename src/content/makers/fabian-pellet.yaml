doc_heading: Fabian Pellet
body: |-
  Fabian Pellet is a Swiss watchmaker who set up his own atelier in Tokyo. Trained at the watchmaking school in La Chaux-de-Fonds, he spent years working on complications at high-end suppliers in the Vallée de Joux before moving to Japan, a reversal of the more common route taken by Sekiguchi and Nakajima. He presented his first watch under his own name in 2024, a three-piece platinum debut that sold immediately, with a titanium version following in 2026.

  The debut runs on his FAP 24, a hand-wound calibre constructed and made almost entirely by Pellet himself on traditional manual machines: main plate, bridges and wheels fabricated in the atelier, with the escapement and hairspring sourced as is normal even among the purists. Case and dial work are executed with Japanese artisan partners, which gives the watches a distinctly local character without outsourcing the movement. Annual production is in the single digits while the titanium series is built.

  Why Tier D and A3.5 / M4: the calibre is his own architecture and the in-house scope on the movement side is properly deep for a one-man operation. The lower authorship citation relative to a Kikuno or a Sekiguchi reflects only that finishing contributions and case work are shared with partners by deliberate arrangement. One tiny debut series is as early as the commercial stage gets. The titanium series and a second calibre are the movements to Tier C.
