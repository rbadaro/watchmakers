doc_heading: Hajime Asaoka
body: |-
  One of the foundational figures of modern Japanese independent watchmaking.

  His eponymous watches include tourbillons, time-only calibres and highly distinctive manually finished movements.

  Do not confuse these with Kurono Tokyo, his intentionally more accessible brand using supplied movements.
  Collector thesis: eponymous Asaoka belongs in serious indie collections.
