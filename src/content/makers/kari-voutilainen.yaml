doc_heading: Kari Voutilainen
body: |-
  Voutilainen represents an unusually complete combination of movement design, movement manufacturing, escapement work, hand finishing, dial making and bespoke commissioning.

  The Vingt-8 is particularly significant because of its large balance and distinctive dual-wheel direct-impulse escapement.

  Key families include Vingt-8, Observatoire, KV20 and later calibres, plus minute repeaters, tourbillons and unique pieces.

  Why canonical: perhaps the best all-round combination of traditional craft and modern independent manufacture.
