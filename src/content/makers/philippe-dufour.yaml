doc_heading: Philippe Dufour
body: |-
  Dufour is effectively the reference against which traditional modern independent movement finishing is measured.

  Key watches:
  - Grande & Petite Sonnerie: a landmark wristwatch adaptation of a highly difficult striking complication.
  - Duality: historically important dual-balance chronometry.
  - Simplicity: mechanically simple but finishing-wise almost archetypal.

  Why canonical: Dufour proved that the market could value perfection of traditional execution as highly as complication.
  Collection role: foundational.
