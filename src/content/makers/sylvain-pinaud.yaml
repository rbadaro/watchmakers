doc_heading: Sylvain Pinaud
body: |-
  Pinaud's Origine is one of the cleanest modern examples of genuine independent manufacture.

  Almost the entire movement is produced within his workshop, including unusually deep involvement with the escapement itself. A GPHG Revelation Prize accelerated his recognition.

  Strengths: movement construction, hand finishing, very contemporary architecture and high component-making content.
  My view: much more important mechanically than his brand recognition currently suggests.
