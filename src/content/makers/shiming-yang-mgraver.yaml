doc_heading: Shiming Yang / Mgraver
body: |-
  The Ventrallis uses an unusual tourbillon and jumping-hour architecture with substantial hand production.

  Yang reportedly produces well over 100 movement components himself, placing Mgraver well beyond the category of a design-led microbrand. Louis Vuitton Prize exposure has increased international recognition.

  Collector thesis: another potentially important participant in the Chinese independent-watchmaking wave.

  Update August 2026: Yang is a semifinalist for the 2026 Louis Vuitton Watch Prize.
