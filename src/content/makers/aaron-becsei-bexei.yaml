doc_heading: Aaron Becsei / Bexei
body: |-
  Becsei is an AHCI member and one of Europe's most under-the-radar complete watchmakers.

  Bexei's appeal comes from proprietary movement construction, extremely low annual production, substantial internal manufacture and idiosyncratic hand decoration.

  The styling can be more Baroque than Smith or Dufour, but mechanically it is serious.
