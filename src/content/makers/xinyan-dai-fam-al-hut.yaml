body: |-
  Möbius combines a biaxial tourbillon with jumping and retrograde indications.

  Fam Al Hut is no longer particularly hidden: Dai reached the final stage of major international independent-watch competitions and has substantial press recognition.

  Why important: one of the strongest examples of sophisticated contemporary Chinese independent horology.
  Collector thesis: still early internationally, but no longer unknown.
