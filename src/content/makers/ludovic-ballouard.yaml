doc_heading: Ludovic Ballouard
body: |-
  Ludovic Ballouard came to his name through complications at F.P. Journe, where he headed the complications department, and through directing Harry Winston's Opus XIII. Working under his own name now from his atelier in Avusy outside Geneva, his two signed architectures are the Upside Down and the Half Time, live on his site today. Production is deliberately tiny, built on made-to-order pieces beside unique collaborations such as the Grail Watch Series Gaga souscription.

  Both named calibres are his own: the hand-wound B01 hides a patented jumping-hour mechanism, where every hour numeral sits on its own disc, upside down until a snail cam and twelve Maltese crosses spin the current hour upright in an instant, 228 components in all at 3 Hz with about 40 hours of reserve. The gear-train layout underneath relies on proven Peseux 7001 geometry, which is the candid reason the manufacture score sits at M3 rather than higher. Decoration, assembly and regulation all happen at his bench-level atelier.

  Why Tier C and A4 / M3: a genuinely original display architecture, sober and instantly recognizable, authored as his own calibre family and collected across collaborations for over a decade, sits comfortably in the middle of Tier C. The scores cap at the delegation line: gearing architecture and components travel the specialist chain rather than his bench. Caveats are the modest public output, made-to-order waits and negligible market velocity; this is a connoisseur's name, not a market one.
