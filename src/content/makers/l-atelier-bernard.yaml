doc_heading: L’Atelier Bernard
body: |-
  Two young Belgian watchmakers and one of the purest first-generation atelier propositions.

  Their first watch, The Owl, revives the duplex escapement, a historically important but today rarely used architecture. Nearly the entire movement is made internally, with specialist items such as the mainspring, hairspring and jewels being the notable exceptions.

  The founding run is just six pieces.

  Why interesting: high component-making content, unusual escapement and minuscule production.
  Collector thesis: Reference 1 is effectively spoken for; become a founding collector of what comes next.
  Priority: top five.
