doc_heading: Dominique Buser & Cyrano Devanthey / Oscillon
body: |-
  Oscillon is the Aargau workshop of Dominique Buser and Cyrano Devanthey, two movement constructors better known outside the brand for running Urwerk's prototyping and special-projects atelier. Their first watch, l'Instant de Vérité, arrived in 2016 around an experimental movement with an annular balance. The 38mm Fundamentum, their second watch, was a semifinalist at the 2023-24 Louis Vuitton Watch Prize. The team has since doubled to four, with David Friedli and Yan Hegelbach joining as watchmakers.

  The claim to the upper half of this pyramid sits in process rather than complexity: every calibre is produced entirely on site, milling wheels and pinions from sheet and rod and finishing them on old manually operated machines, with no CNC anywhere. The Fundamentum runs a hand-wound calibre of 115 parts and 21 jewels at 2.5 Hz. Quill & Pad grouped it with the Greubel Forsey Hand Made 1 and Vincent Deprez's Tourbillon Classique among the most hand-made watches on the market. About five watches leave the workshop each year, and the order book runs years ahead.

  Why Tier C and A4.5 / M5: on manufacture depth Oscillon is at the top of Tier C, because fully in-house calibres built entirely by hand on manual machines are as pure as contemporary making gets. Authorship stays at A4.5 rather than A5 because the two watches so far are deliberately classical exercises, not a distinctive new mechanical language. Tier C rather than B is a verdict on track, not skill: two models, five pieces a year and a single prize shortlist is an outstanding start, not yet a canon. The practical caveat is availability; a new order joins a backlog measured in years.
