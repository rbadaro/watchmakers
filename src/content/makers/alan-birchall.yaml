doc_heading: Alan Birchall
body: |-
  One of the strongest genuine discoveries from this exercise.

  Birchall trained in France, worked in Swiss-brand service in Britain, then spent six years working on watches in Australia before moving to Japan. There is no Roger W. Smith connection.

  His Pièce d’Essai N.00 is a compact 35.4 mm watch built around a 30 mm hand-made movement. Birchall has deliberately avoided CNC in favour of traditional manual machining.

  The prototype already included handmade movement plates, bridges, balance, case, dial and hands. The customer pieces are moving toward an even higher percentage of internally produced components.

  Why I like him: this is not an ex-brand engineer sending CAD drawings to a movement house. Birchall is actually standing at machines making the watch.
  Collector thesis: get into the first proper customer generation.
  Priority: top five.
