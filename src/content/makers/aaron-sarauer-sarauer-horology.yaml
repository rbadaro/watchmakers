doc_heading: Aaron Sarauer / Sarauer Horology
body: |-
  Aaron Sarauer works as Sarauer Horology in Saskatoon, Saskatchewan, one of the very few Canadian bench watchmakers operating outside the coasts. His first watch under his own name, the SH1, arrived in 2025 after several years of one-off commissions, and it was visible enough in the collector spheres that Fine Watch Club sold it before wider press caught up.

  The SH1 combines a new-old Unitas 6498 gear train and escapement with everything surrounding it made by Sarauer in his workshop: a new main plate, new bridges shaped to his own design, his own balance configuration, and extensive in-house work on the dial and hands. He discloses the base openly instead of hiding it under a proprietary calibre name, which is the right kind of transparency for a maker at this stage. The result resembles early Schoots: an architecture someone else designed, under finishes he executed himself, at a price far below the Swiss purists.

  Why Tier D and A3 / M3: honest transformation of a proven base with heavy in-house fabrication on top, very close in position to where Reuben Schoots stood with Series One. The pathway upward is exactly what Schoots then demonstrated with Series Two, designing and making more of the movement itself in each generation. Watch the follow-up references for that migration.
