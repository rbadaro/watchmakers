doc_heading: Vianney Halter
body: |-
  Halter was crucial to the late-1990s and early-2000s independent-watchmaking renaissance.

  The Antiqua remains one of the great radical designs of the era.

  Movement purity varies by period: earlier pieces drew substantially on existing movement architecture, while later work became increasingly proprietary and technically ambitious.
  Historical importance: enormous.
  Movement-first caveat: not as consistently M5 as Smith, Gauthier or Strehler.
