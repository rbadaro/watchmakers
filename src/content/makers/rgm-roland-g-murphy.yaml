doc_heading: RGM / Roland G. Murphy
body: |-
  RGM has quietly rebuilt serious American movement-making capability.

  The Calibre 801 is the core manufacture calibre, while the Pennsylvania Tourbillon pushes further into high-end internal manufacture.

  Why important: one of the longest-running modern attempts to make rather than merely assemble mechanical watches in America.
