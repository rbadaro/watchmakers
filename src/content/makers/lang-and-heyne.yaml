doc_heading: Lang & Heyne
body: |-
  Saxon construction, gorgeous three-quarter bridges, screwed chatons and extremely traditional finishing.

  Founder Marco Lang is no longer the central figure, so today this is a manufacture proposition rather than collecting one individual's work.
  Watchmaking quality: excellent.
