doc_heading: Jiro Katayama / Ōtsuka Lōtec No.9
body: |-
  Do not apply this score to Otsuka Lotec generally. No.9 is the watch that matters here.

  Katayama conceived its SSGT architecture from scratch around jumping hours, rewinding minute display, tourbillon, hour strike and power reserve. A small number of existing components are incorporated, preventing an M5 score.

  Why interesting: extraordinary mechanical ambition from an operation better known for industrial-design playfulness.
