doc_heading: Simon Brette
body: |-
  Brette is probably the best example of why authorship and manufacturing need different scores.

  The Chronomètre Artisans is unquestionably Brette's watch mechanically and aesthetically, but it is intentionally created through an ecosystem of exceptional independent specialists.

  The movement has twin parallel barrels, a 72-hour reserve, 18,000 vph, 194 movement components, a very large balance and bespoke winding and click architecture.

  Collector position: no longer early.
  Long-term view: one of the most likely members of the eventual modern canon.

  Update August 2026: Brette was a Louis Vuitton Watch Prize finalist in 2024, and the Chronomètre Artisans was shortlisted for the 2025 Grand Prix d'Horlogerie de Genève.
