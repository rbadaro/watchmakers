doc_heading: Garrick
body: |-
  Particularly relevant to modern British watchmaking.

  Its upper-end watches now use increasingly proprietary movements produced and finished through Garrick's Norfolk operation and partners. Some lower references continue to rely more heavily on supplied architecture, so evaluate reference by reference.
