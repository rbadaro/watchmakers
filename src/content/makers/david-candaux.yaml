doc_heading: David Candaux
body: |-
  David Candaux, born in 1979 in the Vallée de Joux, is the son and grandson of master watchmakers and had his own bench in his father's workshop from his early teens, alongside more than two decades inside renowned fine-watchmaking houses. He launched his independent signature at Baselworld 2017 with the 1740 First Eight, a 30-degree inclined flying tourbillon in an asymmetric case operated by his patented retractable Magic Crown. The workshop sits in Le Solliat, the Vallée hamlet where his family has made watches for three generations.

  The First Eight's calibre was designed and made in-house from the start, and its current DC1 evolution keeps the same architecture under the renamed H74 calibre, with half-hunter cased variants extending the family. Finishing is restoration-bred Vallée tradition taken personally: his own Côtes du Solliat striping, deep inward angles executed by hand, twenty-three of them on the First Eight alone, and one-of-a-kind renditions in grey gold, titanium or platinum. Output stays in single digits per year, every piece effectively bespoke, backed by a 10-year warranty.

  Why Tier C and A4.5 / M4.5: hand manufacture of this depth, an own tourbillon calibre with own finishing school, justifies the Tier B flag on craft alone. What holds the placement at C is validation track rather than ability: the recognition record is AHCI membership and specialist-press acclaim rather than prizes or a documented auction series, though an Antiquorum result of EUR 137,760 for a First Eight marks a start. Caveats are the near-absent public market footprint and that acquisition is a relationship, not a purchase.
