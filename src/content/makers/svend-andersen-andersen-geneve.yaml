doc_heading: Svend Andersen / Andersen Geneve
body: |-
  Svend Andersen is a Danish-born Geneva master who learned his trade in after-sales at Gübelin, came to prominence with his bottle-clock constructions, and spent nine years inside Patek Philippe's Atelier des grandes complications from 1969. He set up his own atelier in 1980 and, with Vincent Calabrese, co-founded the AHCI in 1985. Four decades on, the atelier's signatures are world-time Communication pieces, erotic automata, calendar complications and jumping hours, mostly unique or very small series, at around 50 watches a year.

  Andersen Geneve builds its signatures as complications of its own design, the world-time module measures 0.9mm and dates from the late 1980s, mounted on historically sourced base calibres, the textbook specialist architecture this report's M-scale was written against. The Communication world-time line goes back to 1990, the perpetual secular calendar to 1996, and the Communication 45 released for the brand's 45th year repeats the recipe: a reworked vintage automatic calibre under an in-house module, exacting hand finishing, and a case from the atelier's own La Chaux-de-Fonds case workshop. Over the whole history of the house, fewer than 1,300 watches have been made.

  Why Tier C and A3.5 / M3: this is a canon correction, not a discovery: an AHCI co-founder absent from a maker map is a straightforward gap, and the analytical framework writes him in on forty years of unique complications alone. Authorship stays capped where construction is delegated: complications and modules are his own design, base movements are not, which is precisely the A3.5 / M3 pairing on the report's ladder. Caveats are succession, since the founder is 83 and continuity runs through the atelier rather than a named heir, and allocation, since nearly everything sells to existing clients off a quiet public profile.
