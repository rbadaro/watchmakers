doc_heading: Laurent Ferrier
body: |-
  Ferrier is already one of modern independent watchmaking's defining aesthetic voices, but the movements deserve equal attention.

  The micro-rotor calibre with natural escapement is the key mechanical Ferrier. It combines micro-rotor automatic winding, direct-impulse natural escapement, highly classical bridge design and superb but restrained finishing.

  Why Ferrier matters: almost perfect balance between technical sophistication, movement aesthetics and wearability.
  Collector status: established blue-chip independent, although still dramatically easier to buy than Smith or Rexhepi.
