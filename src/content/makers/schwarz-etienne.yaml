doc_heading: Schwarz Etienne
body: |-
  Another sleeper manufacture.

  Schwarz Etienne has deep internal calibre capability and group access to regulating-component production. It also plays an important role supplying movement technology to other independent brands, which can obscure how much capability exists inside the company itself.
