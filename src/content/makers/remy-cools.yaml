doc_heading: Rémy Cools
body: |-
  One of the strongest candidates to become a future canonical name.

  The current Tourbillon Atelier uses an entirely new mechanical calibre rather than recycling his first series. Cools' atelier handles nearly every stage: mainplates, bridges, gear and wheel cutting, decoration, finishing, hairspring work and gilding.

  Production is around 12 watches per year, and the Tourbillon Atelier series totals 36 pieces.

  Why important: Cools combines true making with an increasingly recognisable design language.
  Collector position: discovery has happened, but the career is still young.
  Long-term view: future Tier A/S candidate.
