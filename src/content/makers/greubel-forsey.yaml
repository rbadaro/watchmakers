doc_heading: Greubel Forsey
body: |-
  This is no longer a tiny one-man atelier, but excluding Greubel Forsey from a movement-first independent map would be absurd.

  Its technical work spans inclined tourbillons, multiple tourbillon systems, differential systems, sophisticated balances and extreme hand finishing.

  The Hand Made collection pushes the idea further, with exceptionally high manual production and even internal hairspring work in selected projects.

  Why canonical: one of the absolute peaks of modern mechanical execution.
