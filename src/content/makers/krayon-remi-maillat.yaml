doc_heading: Krayon / Rémi Maillat
body: |-
  Maillat's specialism is unusual astronomical and mathematical complication design.

  Everywhere and Anywhere are not derivative perpetual-calendar exercises but novel solutions for indicating sunrise, sunset and temporal information.

  Strength: mathematical movement design.
  Manufacture caveat: more constructor than one-man component maker.
