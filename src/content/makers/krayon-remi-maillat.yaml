doc_heading: Krayon / Rémi Maillat
body: |-
  Maillat's specialism is unusual astronomical and mathematical complication design. He founded a movement-engineering studio in 2013 and debuted his first watch in 2017.

  Everywhere (2017) was a world first: a universal mechanical calculator giving sunrise and sunset times anywhere on Earth, settable by the wearer, in nearly 600 components. The bespoke Everywhere Horizon took the 2018 GPHG Innovation Watch Prize the following year; production is now paused, from CHF 700,000.

  Anywhere (2020, calibre C030) simplified the same idea to one location chosen by the owner and set by Krayon's watchmakers. It won the 2022 GPHG Calendar and Astronomy Prize. Anyday (2024, calibre C032) is the departure from the sun-theme duo: a month-at-a-glance "mechanical planner" calendar in white gold, capped at 45 pieces a year, with deliveries beginning August 2025.

  Strength: mathematical movement design. Everywhere and Anywhere are not derivative perpetual-calendar exercises but novel solutions for indicating sunrise, sunset and temporal information.
  Manufacture caveat: more constructor than one-man component maker; parts come from specialist suppliers, with assembly and finishing in a Neuchâtel atelier of about a dozen producing roughly 40 watches a year.
