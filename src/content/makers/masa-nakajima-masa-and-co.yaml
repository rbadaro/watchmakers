doc_heading: Masa Nakajima / Masa & Co.
body: |-
  One of my favourite sleepers.

  Nakajima spent roughly a decade developing the MP1 architecture. The remarkable part is not merely the time spent: Masa's workshop reportedly makes effectively everything apart from specialist springs and jewels.

  The result is much closer philosophically to Smith or Kikuno than to the typical independent brand with a proprietary calibre.

  Masa & Co. also provides the ecosystem for Nayuta Shinohara's work, so these should not be viewed as two completely independent exposures.

  Collector thesis: significant technical substance before equivalent Western-market recognition.
  Priority: top ten; possibly the sleeper of the whole report.

  Update August 2026: Masa & Co. was selected in the preliminary round of the 2026 Grand Prix d'Horlogerie de Genève; winners will be announced on 7 November 2026.
