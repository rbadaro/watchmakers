doc_heading: Zehua Tan
body: |-
  Tan Zehua, born in 1953 into a horological family in Guangdong, is an AHCI full member since 2019 and one of the elder statesmen of genuinely independent Chinese movement-making. He should not be confused with the younger wave around Mineroci or Mgraver: Tan has been at this for decades and even builds some of his own machines and tooling.

  His claim is real: at least four proprietary movements so far, including a ten-day long-power calibre, and a patented Di-Axial split-axis escapement, an original escapement architecture he designed and patented himself. Output is small-series and largely sold inside China, which is why Western collectors rarely see a Tan in the metal even though the engineering is original in a way many Swiss independents cannot match.

  Why Tier D and A3 / M3, with the candid caveat already noted in the thesis: the movement and escapement authorship is strong, but press inspections consistently describe finishing quality as a step below the Swiss and Japanese handmade bar, and M3 rather than M4 reflects that the fabrication chain is not fully in his own workshop across all series. The Di-Axial escapement alone earns ongoing radar: original escapement design is the rarest currency in independent watchmaking, and if his finish rises, this entry moves.
