doc_heading: Raúl Pagès
body: |-
  Pagès came from restoration, which matters because it gives his work deep historical grounding.

  The RP1 Régulateur à Détente contains a hand-crafted pivoted detent escapement, an extraordinarily rare proposition in a modern wristwatch. He won the inaugural Louis Vuitton Watch Prize in 2024.

  Why it matters: Pagès is not merely decorating a high-end movement. The escapement itself is a serious piece of watchmaking authorship.
  Long-term: future master.

  Update August 2026: the Régulateur à détente RP2 was shortlisted for the 2025 Grand Prix d'Horlogerie de Genève.
