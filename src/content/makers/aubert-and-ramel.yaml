doc_heading: Aubert & Ramel
body: |-
  Among the young ateliers, Aubert & Ramel stand out because they are not merely designing an own movement. They are actually making a remarkable amount of the regulating system themselves, including the balance and forming their own overcoil.

  The debut Ouréa founding series comprises only 20 watches, initially divided between platinum Souscription pieces and titanium watches.

  Why important: apprentices and alumni emerging from today's high-end artisan ecosystem increasingly outsource precision micromechanics. Aubert & Ramel are moving in the opposite direction.
  Collector thesis: pursue any remaining founding allocation or cancellation; otherwise establish yourself for Reference 2.
  Priority: extremely high.

  Update August 2026: Aubert and Ramel were selected in the preliminary round of the 2026 Grand Prix d'Horlogerie de Genève; winners will be announced on 7 November 2026.
