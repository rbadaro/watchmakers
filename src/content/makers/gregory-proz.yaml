doc_heading: Gregory Proz
body: |-
  Proz is extremely early in commercial history but already discovered by serious collectors.

  His debut Genèse is a classical hand-wound watch with a moonphase on the reverse, produced as an initial run of only 20. The extraordinary signal is demand: the first 20 allocations sold extraordinarily early, effectively before collectors had a finished production watch in front of them.

  Why interesting: BNB Concept background, long proximity to Geneva's complications ecosystem and a highly credible watchmaking network.
  Why not an immediate top-five action: Reference 1 is effectively unavailable.
  Strategy: watch closely for Reference 2 rather than chase Genèse at any price.
