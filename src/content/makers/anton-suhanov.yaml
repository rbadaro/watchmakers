doc_heading: Anton Suhanov
body: |-
  Anton Suhanov, born in 1983 in St Petersburg, trained as a design engineer and spent about a decade at Konstantin Chaykin, where he worked as chief designer, before founding his own brand in 2018. He won the F.P. Journe Young Talent Competition in 2016 as one of three laureates that year, became an AHCI member in 2025, and took the GPHG Horological Revelation prize in November of the same year for the St Petersburg Easter Egg Tourbillon Clock. His atelier works on bespoke commissions plus small series out of the Matisov Pereulok workshop.

  The catalogue is clock-led, and that is deliberate: the Pharos three-axis tourbillon clock of 2019 introduced his signature flaming balance, a dial-side regulator with luminescent inserts, the Lotus tourbillon clock of 2020 followed, and the prize-winning Easter Egg clock carries the same balance set in a gold-bearing rock. Wristwatches are the younger line, from the Racer chronograph of 2021 through the Chronotope Racer Retro to the Flamingo, built around the first fully in-house wristwatch calibre of his career. Bespoke orders account for most of the output on both sides of this line.

  Why Tier C and A3.5 / M4: genuine calibre authorship, independently confirmed by two different prize juries a decade apart, places him clearly above Tier D. The explicit caveat is medium balance in the literal sense of his catalogue: most of his public output remains clockwork, and the wristwatch line is young, so the maker scores stay preliminary pending delivered volume. He enters as a post-discovery name rather than a discovery, which the foot of Tier C accommodates.
