doc_heading: McGonigle Watches
body: |-
  John and Stephen McGonigle came from serious Swiss complications backgrounds.

  The eponymous watches include Tuscar, tourbillons, highly complicated pieces and distinctive hand-finished calibres.

  Why interesting: genuine high-end Irish watchmaking with far less market recognition than comparable Swiss makers.
