doc_heading: Hazemann & Monnin
body: |-
  Their School Watch houses the fully in-house HM01, synchronising passing strike, instantaneous jumping hour and conventional minutes and seconds.

  Hazemann & Monnin won the second Louis Vuitton Watch Prize, the 2025–26 edition.

  That recognition effectively ended the truly undiscovered phase.
  Movement credentials: excellent.
  Collector strategy: monitor their first post-prize production or reference.

  Update August 2026: the pair also received the 2026 HSNY Independent Watchmaker Grant, presented at the Society's New York gala.
