doc_heading: Stéphane Pierre
body: |-
  Pierre's L’Impétrant is an unusually ambitious debut. The 295-component movement incorporates bi-retrograde jumping indications, Maltese-cross stopwork, unusual dial-side architecture and highly sculptural construction.

  Why interesting: serious movement design rather than simply finishing.
  Current view: promising, though Cleguer and Aubert & Ramel remain stronger mechanically.

  Update August 2026: L'Impétrant was selected in the preliminary round of the 2026 Grand Prix d'Horlogerie de Genève; winners will be announced on 7 November 2026.
