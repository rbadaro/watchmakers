doc_heading: Petermann Bédat
body: |-
  Gaël Petermann and Florian Bédat produce exceptionally refined neo-classical movements.

  The 1967 established them with deadbeat seconds; later references expand their range while preserving beautifully restrained construction.

  Strength: extraordinarily refined movement architecture and finishing.
  Long-term: very plausible Tier A.
