  Zwinz has an extraordinary behind-the-scenes career and worked within some of the finest modern independent-watchmaking environments.

  Winnerl's newer movements have become increasingly original, including blank-sheet movement development.

  Why care: maker's-maker credentials with much less collector fame than Brette or Rexhepi.

