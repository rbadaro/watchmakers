doc_heading: Roger W. Smith
body: |-
  The most direct living continuation of George Daniels' philosophy.

  Smith worked with Daniels, inherited his workshop equipment and has spent years evolving the co-axial escapement into his own single-wheel implementation.

  Smith's workshop makes essentially everything from raw material except specialist components including balance spring, mainspring, jewels, sapphire, seals and straps.

  Key watches include Series One through Series Six, with Series Two the foundational production movement designed specifically around the Daniels co-axial concept.

  Why canonical: arguably the clearest modern example of 'the complete watchmaker'.
