doc_heading: Ondřej Berkus
body: |-
  Ondrej Berkus is a self-taught Czech movement-maker who rebuilt George Daniels' Watchmaking into a working method after years of forging knives, founding his own workshop in rural Czechia and relocating to Italy in 2025. His Black Hole Tourbillon took the public 2023 Watch of the Year award at the Salon of Exceptional Watches in Prague, making him the only Czech so far to receive a significant international watchmaking award. A circa-2023 Remontoire Dead Beat Seconds in titanium then sold for CHF 69,850 in The Decade One Geneva sale at Phillips in November 2025, his first international auction result, with the Minion 2 one-off following at Phillips New York that December.

  Each commission is designed around a self-imposed mechanical brief, so the catalogue reads as a list of constructions rather than models: a central tourbillon co-axial with a single curved hand, a remontoire with a dead-beat seconds, twin balances linked by a differential, a sonnerie au passage. He machines his own cases in titanium, Damascus steel and mokume-gane, and estimates about 75 percent of each watch as handmade, openly keeping proven gear trains where that aids longevity and serviceability. Output is roughly eight to twelve one-off watches a year, sold off a waitlist he himself describes as longer than his lifetime.

  Why Tier C and A4 / M4.5: successive ground-up one-off calibres across architectures rare even as shared ambitions for a solo maker justify full authorship, and the auction market has now validated the work outside the prize circuit. The scores stop where making is delegated rather than designed: proven gear trains are retained by choice, and finishing was historically raw by his own admission before he began working with a dedicated finisseur trained under Philippe Narbel. Caveats are the one-off format, which builds no coherent series language, and the deliverability reality of a waitlist that long.
