doc_heading: Vincent Calabrese
body: |-
  One of the foundational figures of modern independent watchmaking and a co-founder of the AHCI.

  His long career includes the Spatiale concept and numerous unconventional movement constructions.

  Why he matters: historically more important than his current auction or social-media profile would suggest.
