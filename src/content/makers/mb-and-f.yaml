doc_heading: MB&F
body: |-
  MB&F intentionally complicates the authorship question.

  Max Büsser creates the concepts, but the entire philosophy is to collaborate openly with 'Friends', including external movement constructors, designers and finishers. Later movements are increasingly conceived internally.

  Why important: one of the most influential independent brands of the century.
  Why M3: collaboration is the point, not vertically integrated production.
