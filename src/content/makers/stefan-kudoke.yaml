doc_heading: Stefan Kudoke
body: |-
  Kudoke bridges traditional German finishing and genuinely proprietary movement work.

  The Kaliber 1 family is his own design but uses specialist and shared components and historical design influences, hence the lower manufacture score.

  Why attractive: exceptional value for genuinely artisanal German watchmaking.
  Best thesis: buy for merit and value, not scarcity speculation.
