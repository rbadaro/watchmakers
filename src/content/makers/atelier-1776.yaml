doc_heading: Atelier 1776
body: |-
  Atelier 1776 is the Philadelphia-area project of Jason Lu and Zach Smith, one of the rare American haute-horlogerie workshops. Earlier pieces were heavily transformed Unitas 6498 constructions, but the 2026 Liberty 250, timed to the United States semiquincentennial, marks a claimed change of scale: an American dress watch at a high manufacture level. They are among the 23 artisans at the Indies.NYC salon in October 2026.

  The Liberty 250's claim, per the makers and the pre-order listing, is more than 90 percent in-house movement manufacture: mainplate, bridges, wheels, screws, balance and regulating organ fabricated in their own workshop, finished to a declared haute standard. That description, if it survives factory-level verification, would place them well above every other American bench entry in this map.

  Why Tier D and A3 / M3, with the candid caveat: the verified record today is transformed Unitas work, and the ambitious 90 percent figure is so far the makers' own claim with thin independent inspection. This is written as an early-promise entry rather than a conclusion. The trajectory is exactly the one to monitor among American independents: if a visiting journalist or an auction examination corroborates the claim, this entry upgrades on manufacture immediately.
