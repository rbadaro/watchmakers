doc_heading: Bonniksen — Maximin Chapuis & Jason Chevrolat
body: |-
  Bonniksen is attempting an almost deliberately anachronistic form of watchmaking: every component designed, shaped and finished manually using traditional techniques.

  Its first major project is Naissance d’une Montre 4 – Le Carrousel, backed by the Time Æon Foundation. It revives Bahne Bonniksen's carrousel mechanism in a sub-40 mm wristwatch and is intended as a genuine handmade transmission project.

  Why it matters: Time Æon places it directly in the intellectual ecosystem associated with Philippe Dufour, Greubel Forsey and preservation of traditional hand watchmaking.
  Catch: unlike discovering Rexhep when his watches were relatively inexpensive, Bonniksen has been institutionally validated from day one. You are early chronologically but not economically.
  Priority: high if money is secondary to historical position.
