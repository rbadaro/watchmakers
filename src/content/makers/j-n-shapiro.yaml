doc_heading: J.N. Shapiro
body: |-
  Shapiro has evolved from an exceptional guilloché and dial specialist into one of America's most serious complete watch manufacturers.

  The Resurgence represents that transition: a largely US-made movement, case, dial and substantial regulating architecture produced inside Shapiro's operation.

  Important correction: Shapiro did not win the second Louis Vuitton Watch Prize. Resurgence was a semi-finalist; Hazemann & Monnin won.

  Why important: there are very few modern attempts to rebuild essentially complete haute-horlogerie capability in the United States.
