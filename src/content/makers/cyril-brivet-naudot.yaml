doc_heading: Cyril Brivet-Naudot
body: |-
  One of the names I think collectors systematically undervalue.

  Brivet-Naudot follows an unusually uncompromising production philosophy. Movements are largely produced manually, with comparatively little reliance on modern CNC manufacture. His watches have featured proprietary free and detent-inspired escapement work, and he personally makes an extraordinary percentage of the watch.

  Why he is special: many independent watchmakers are designers and finishers. Brivet-Naudot is much closer to the historical meaning of watchmaker.
  Collector opportunity: market recognition remains low compared with technical substance.
