doc_heading: Xhevdet Rexhepi
body: |-
  Xhevdet should not simply be treated as 'Rexhep's brother'.

  The Minute Inerte has a genuinely unusual mechanism: the seconds hand traverses the dial in 58 seconds, pauses for two seconds, and the minute hand jumps instantaneously.

  It is a poetic complication rather than a conventional chronometric one.
  Collector status: already discovered.
  Long-term question: can his second and third references build a sufficiently distinct identity from Akrivia?
