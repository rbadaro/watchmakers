doc_heading: Masahiro Kikuno
body: |-
  Kikuno is one of the purest handmade-watch practitioners alive.

  His philosophy is explicitly to make watches using his own hands, brain and tools, placing himself conceptually alongside historical watchmakers rather than modern industrial manufacture.

  His work includes famous Wadokei interpretations, tourbillon work and more recent complicated pieces.
  Why important: culturally and mechanically distinctive rather than Swiss watchmaking reproduced in Japan.
