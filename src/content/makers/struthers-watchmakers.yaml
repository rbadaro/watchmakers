doc_heading: Struthers Watchmakers
body: |-
  A much more important inclusion for the British side of the map.

  Rebecca and Craig Struthers' Project 248 involves development of their own calibre, drawing heavily on traditional English lever-watch construction.

  They combine restoration knowledge with genuine movement-making ambition.
  Why interesting: if Smith and Frodsham are the established pinnacle of modern British movement making, Struthers is an important younger branch.
