doc_heading: Grönefeld
body: |-
  Bart and Tim Grönefeld produce some of the most beautifully finished modern movements.

  Notable work includes One Hertz deadbeat seconds, Parallax Tourbillon, 1941 Remontoire and Principia automatic.

  Component supply is more distributed than with Smith or Cools, hence the lower M score.
  Quality: extremely high.
  Collector status: firmly established.

  September 2026 flagship 1941 Quadrivium combines the house's signature 7.5s remontoire, flying tourbillon, central jumping seconds and power reserve in one new 473-component movement. Hodinkee reports Gronefeld has paused order intake on other models due to demand.
