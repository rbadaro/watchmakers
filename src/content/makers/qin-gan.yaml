doc_heading: Qin Gan
body: |-
  Qin Gan is a good example of a maker who is not really undiscovered domestically but remains underappreciated in Western collecting.

  The Pastorale family uses his own movement architecture and shows a restoration-trained maker transitioning into highly refined contemporary independent watchmaking.

  Strength: quiet classicalism rather than attention-seeking mechanics.
  Collector thesis: geographical awareness arbitrage rather than genuinely pre-discovery.
