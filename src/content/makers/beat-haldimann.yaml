doc_heading: Beat Haldimann
body: |-
  Haldimann represents an almost philosophical rejection of industrial watchmaking.

  Known for central tourbillons, resonance, hand-production methods and extremely individual constructions.

  Why important: one of the pure old-school independent craftsmen.
