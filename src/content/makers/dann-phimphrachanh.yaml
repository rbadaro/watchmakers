doc_heading: Dann Phimphrachanh
body: |-
  Dann Phimphrachanh carries one of the densest resumes of anyone arriving this year: Parmigiani, Greubel Forsey, Daniel Roth and Jaeger-LeCoultre on the bench before going independent. He became an AHCI candidate in 2025, when SJX and Quill and Pad both profiled his new workshop and debut watch, and he has shown prototypes with what press describes as a genuinely promising order book.

  The Seconde Vive is built around a proprietary dead-beats-style jumping-seconds mechanism of his own design, traditionally machined and finished by hand. The jumping-seconds module sits on a proven base movement, so the construction is partial authorship rather than a full calibre, but the complication itself is the part that matters and it is properly his, in the manner a modulemaker used to the highest finishing executes it.

  Why Tier D and A3 / M3: this is the strongest commercial signal among the current AHCI candidate cohort, with real apprenticeship pedigree behind every gear cut, but authorship is limited to the module on a base movement for now. If the second reference carries more of his own calibre, the movement-maker thesis upgrades fast. Watch his order book conversion: sustained demand from the first series is the rare signal that distinguishes makers who last from makers who launch.
