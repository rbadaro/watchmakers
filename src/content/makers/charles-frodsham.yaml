doc_heading: Charles Frodsham
body: |-
  One of the most intellectually satisfying modern independent watches is the Double Impulse Chronometer.

  Its escapement derives from the Daniels and Derek Pratt exploration of double direct impulse and was engineered specifically for the wristwatch.

  The movement displays extraordinarily high manufacturing and finishing integration.
  Why important: serious continuation of British chronometer and escapement development rather than nostalgic branding.
  Collector position: established, extremely scarce and difficult.
