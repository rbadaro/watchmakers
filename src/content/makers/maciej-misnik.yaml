doc_heading: Maciej Miśnik
body: |-
  Maciej Miśnik is a Warsaw maker from a fifth-generation watchmaking family, trained in physics, building his own timepieces since 2019. His name reached the wider world in 2022 when he won the F.P. Journe Young Talent Competition with a pocket watch that was remarkable even by the competition's standards, and he has since been admitted as an AHCI candidate member.

  The winning piece was a marine-detent tourbillon pocket watch made almost entirely by Miśnik himself without CNC: a pivoted detent escapement with an anti-shock torque buffer for the hairspring, a Breguet overcoil, poising screws instead of a regulator index, engineered and executed from classical references in a direction that sits in the Derek Pratt lineage. It is an unusually serious piece of chronometer science for a young-talent entry, closer to graduate research than to a school project.

  Why Tier D and A3 / M4, with an explicit caveat: his output so far is the showpiece pocket watch and bespoke commissions, not a commercial wristwatch line, so this sits alongside Anton Suhanov as the closest thing the map has to a pocket-watch and bespoke lane. The prize provenance (YTC 2022) keeps him far above the patron stage, and the first wristwatch, when it comes, is likely to be the trigger for Tier C consideration.
