doc_heading: Christophe Claret
body: |-
  Claret was an elite movement constructor before becoming a consumer-facing watch brand.

  His manufacture has created movements for numerous prestigious houses and can handle extraordinarily complicated mechanisms.

  Own-name creations have included tourbillons, minute repeaters, gaming complications, striking watches and unconventional displays.

  Why important: one of the major hidden engines behind modern complication watchmaking.
