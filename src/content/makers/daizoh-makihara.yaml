doc_heading: Daizoh Makihara
body: |-
  Makihara's work combines high-level watchmaking and exceptional Japanese decorative craft.

  Beauties of Nature includes animated botanical elements and a perpetual moonphase around his own DM movement architecture.

  Production is tiny enough that lead times can become extraordinary.
  Why interesting: arguably more artistic than chronometric, but still genuine movement watchmaking rather than decorative packaging.
