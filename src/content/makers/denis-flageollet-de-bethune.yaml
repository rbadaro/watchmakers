doc_heading: Denis Flageollet / De Bethune
body: |-
  De Bethune is less like a conventional luxury-watch manufacturer and more like an experimental horological laboratory.

  Its technical innovations include proprietary balance architectures, hairspring terminal curves, silicon escapement components, ultra-light tourbillons, self-regulating twin barrels, spherical precision moonphase, deadbeat seconds and novel shock systems.

  Why important: intellectually one of the most important independent manufactures of the last 25 years.
