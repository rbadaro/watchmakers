doc_heading: Konstantin Chaykin
body: |-
  Chaykin is often underestimated because the Joker and Wristmon watches look playful.

  Behind that lies a prolific mechanical inventor. His work includes proprietary regulators, astronomical watches, exotic displays and increasingly complete in-house calibres.

  Why interesting: one of the most prolific mechanical idea generators in contemporary independent watchmaking.
