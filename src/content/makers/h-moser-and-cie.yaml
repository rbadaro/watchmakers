doc_heading: H. Moser & Cie.
body: |-
  Moser is much larger than the artisan ateliers, but mechanically far more vertically integrated than many collectors realise.

  Its group includes Precision Engineering, providing unusual control over hairspring and regulating-component capability.

  Notable movements include modular escapement systems, perpetual calendar, minute repeater, tourbillon and sophisticated automatic calibres.

  Launched in September 2026 under the Moser Exploration LAB, the Streamliner OFF-GRID is a connected ana-digi model (Calibre D10 developed with Sequent), made in 1,000 pieces per colourway; its order window closed on 5 October 2026.
