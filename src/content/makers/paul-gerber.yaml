doc_heading: Paul Gerber
body: |-
  Gerber is another historical independent whose technical contribution exceeds his collector fame.

  His work has included proprietary escapement experimentation, alarm mechanisms, complicated automatics and highly ingenious commissioned movements.

  Collector thesis: a technical historian's choice rather than a momentum trade.
