doc_heading: Marco Tedeschi
body: |-
  Marco Tedeschi trained at the École Technique de la Vallée de Joux and again as a microtechnology engineer, designing his first central-tourbillon calibre while still a student; when he contacted industry figures, only Jean-Claude Biver answered, which is how Hublot happened. There he contributed to the brand's manufacture build-out and the UNICO chronograph, later becoming CEO of Romain Jerome, before starting his own venture. That venture operated as Kross Studio for its first six years, financing the construction of a real manufacture in part through subcontracting for established brands, and was rebadged under his own name at Watches and Wonders 2026 with the MT 1.1 collection; Chanel holds a minority stake.

  The rebadged house describes itself as from movement to watch, fully in-house, and the description has substance: the Gland manufacture counts over 40 specialists across engineering, machining, finishing, assembly, quality control and prototyping. The MT 1.1 Tourbillon 7 Jours runs the openworked central-tourbillon calibre MT 7010 IRM with a seven-day reserve, crownless winding and setting via a case-side pusher and rotating caseback, cased in titanium, tantalum or gold. Kross Studio remains one of the brand's core activities as the collaboration playground under the Marco Tedeschi umbrella.

  Why Tier C and A4.5 / M4: the authorship is real, from the student central tourbillon through the UNICO years into an own calibre family, and the manufacture capability is unusually deep for this tier, the combination the A4.5 / M4 pairing encodes. The candid caveat is scale and provenance: this is Kross Studio's integrated 40-person manufacture rebadged under its founder, not a bench-scale discovery, so the scores credit a founder-led manufacture rather than individual bench work. The Tier B flag rides on capability and is set to review once the eponymous identity settles; the first two years under the new name decide whether it raises.
