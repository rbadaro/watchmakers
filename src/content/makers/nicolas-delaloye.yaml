doc_heading: Nicolas Delaloye
body: |-
  Nicolas Delaloye spent years as a constructor next to David Candaux, one of the reference masters of traditional bench construction, which means his training lineage is unusually direct. In 2024 he launched his own name from Geneva with a single model, and he is among the 23 independent artisans exhibiting at the Indies.NYC salon in October 2026.

  The Delaloye 01 is a fully hand-made tourbillon wristwatch, built and finished by Delaloye personally in the manner his years with Candaux taught: new movement architecture around a one-minute tourbillon, traditional fabrication, contemporary finishing standard. Casework and dials use local specialist partners, as nearly everyone at this level does, while the movement itself is the in-house proposition.

  Why Tier D, knocking on Tier C, and A3 / M4: construction authorship is real and the manufacture practice is closer to the small factories-in-miniature model than to the design-led independents. The open question is differentiation: one reference so far, visual vocabulary still close to the school of Candaux that formed him. A second reference showing his own dialect would complete the case for Tier C, and the pedigree argues the market will see it.
