doc_heading: Norifumi Seki / Quiet Club
body: |-
  Seki is already known in Japanese independent circles but remains unusually early internationally.

  Quiet Club's debut Fading Hours combines unconventional time display with a mechanical alarm architecture. The movement is designed, engineered and substantially hand-crafted by Seki.

  Quiet Club has additionally benefited from Louis Vuitton Watch Prize visibility, so the discovery window is narrowing.

  The more interesting long-term proposition may actually be Seki himself rather than Quiet Club as a brand. His stated ambitions make the possibility of a future eponymous atelier particularly interesting.
  Collector thesis: owning an early Quiet Club may establish the relationship that matters later.
  Priority: very high.

  Update August 2026: Quiet Club was selected in the preliminary round of the 2026 Grand Prix d'Horlogerie de Genève; winners will be announced on 7 November 2026.
