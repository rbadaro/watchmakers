doc_heading: Shin Ohno
body: |-
  Ohno is currently the most literal version of the thesis: find the important watchmaker before his first commercial wristwatch exists.

  His breakthrough was Fuyu-Geshiki, winner of the 2026 F.P. Journe Young Talent Competition. It is not a student three-hander but an extraordinarily ambitious grande/petite-sonnerie, repeater and tourbillon clock project. He designed and manufactured essentially everything himself apart from specialist components such as jewels, bearings and springs.

  The significance is not the competition trophy alone. It demonstrates that Ohno already has the technical range to conceive complicated mechanisms and the manual ability to make them. There is still no normal Shin Ohno wristwatch catalogue.

  Collector thesis: establish contact now rather than trying to buy something now.
  Risk: we do not yet know what his commercial wristwatch aesthetic, price or production model will be.
  Priority: exceptionally high.
