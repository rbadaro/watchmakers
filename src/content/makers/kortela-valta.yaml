doc_heading: Kortela Valta
body: |-
  Kortela Valta is a two-man workshop in Porvoo. Roope Kortela and Rene Valta met at the Finnish School of Watchmaking in 2021, built their final-year school watch together and launched the brand straight out of their studies, the youngest branch yet on the Finnish line that runs from Voutilainen through Sarpaneva and Koivukoski.

  The Eka (2024, eight pieces) and the Toka (2026, twelve pieces, with a champlevé Grand Feu enamel dial milled in-house from sterling silver) are extensive transformations of the vintage Omega calibre 266 gear train. The compelling detail is the balance: made in-house, free-sprung, with platinum escape weights and a hand-shaped Breguet overcoil fitted to a Carl Haas hairspring. Bridges are the duo's own designs in German silver, machined in Finland, and the dial, hands, crown and movement screws are all made at the bench. The hand finishing is well above anything near the price point.

  Why Tier D and A3 / M2: the main plate, wheels and escapement remain Omega originals, so the movement is theirs by transformation rather than by architecture. That is the same launch position Atelier de Chronométrie used before becoming a collector staple, and the duo openly states that a fully in-house Finnish movement is the goal. Nothing in their bench work suggests they will not get there. Collector thesis: early entry into the next Finnish generation with strong value even before a proprietary calibre exists; the scores move the day that movement lands.
