doc_heading: Annelinde Dunselman
body: |-
  Annelinde Dunselman works alone in Zwolle in the Netherlands. Trained as a watchmaker and goldsmith at Vakschool Schoonhoven, she served her internship at Jaeger-LeCoultre, studied decoration at Manufactor, worked for Grönefeld from 2019 to 2022 and also spent time with Philippe Narbel. Her debut Black Tulip launched during Watches and Wonders week 2025, and she is one of the three 2026 HSNY Independent Watchmaker Grant recipients, alongside Bradley Taylor and Hazemann & Monnin.

  The Black Tulip's Cal. D202.5 is her own design from a clean sheet: she began by modifying a Peseux 7001, abandoned that, and developed the movement from scratch over roughly two and a half years with a technical draughtsman and befriended specialists. The hand-wound calibre offers 100 hours of reserve, a zero-reset hacking seconds, 21,600 vibrations per hour, 125 components, and a free-sprung balance, with hand-polished bevels throughout rhodium-plated mainplate and bridges. Components are fabricated by suppliers to her drawings; assembly, decoration and adjustment are hers alone, with no outside investment behind the project. The series is limited to ten pieces, still in delivery.

  Why Tier D and A4 / M2: the design authorship is high on paper, an own calibre rather than a reworked vintage architecture, but the physical manufacture stops at design, finishing and assembly because the precision components are supplier-made, and she is candid about that division. A single ten-piece first series still shipping is textbook first commercial generation. The HSNY grant confirms the recognition cycle has begun; a second movement largely manufactured in-house would be the argument for Tier C.
