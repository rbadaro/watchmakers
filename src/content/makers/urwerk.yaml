doc_heading: Urwerk
body: |-
  Felix Baumgartner and Martin Frei have created one of the strongest visual and mechanical languages in watchmaking.

  Signature architecture revolves around satellite and hour systems rather than conventional hands. Some movements use supplied foundations; others involve far deeper internal movement creation.

  Authorship: unquestionably high.

  The UR-1001 Amadeus (2026) is a unique hand-engraved titanium pocket watch (cal. UR-10.01) with 100-year and 1,000-year indicators, around 500 hours of engraving by Florian Güllert, priced CHF 450,000, shown at Geneva Watch Days 2026.
