doc_heading: Bernhard Lederer
body: |-
  The Central Impulse Chronometer is one of the most technically compelling modern wristwatches.

  It uses two independent gear trains, twin 10-second remontoires and a central direct-impulse escapement. The architecture was developed over many years.

  This sits intellectually much closer to Daniels or Strehler than to ordinary high-end Swiss-lever watchmaking.
  Why undervalued: Lederer's name is far less fashionable than the mechanics deserve.
