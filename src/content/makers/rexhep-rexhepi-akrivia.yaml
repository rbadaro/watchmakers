doc_heading: Rexhep Rexhepi / Akrivia
body: |-
  Rexhep is important here partly because his career is the pattern we are trying to detect earlier in others.

  He emerged from elite complications work, created Akrivia extremely young and gradually transformed from promising young constructor into one of the defining independents of his generation.

  Essential pieces include the early Akrivia tourbillons, Chronomètre Contemporain and RRCC II.

  Why canonical: technical ability, finishing, aesthetic identity and extraordinary collector demand have converged.
  Practical reality: the early-discovery phase is over.
