doc_heading: Armin Strom
body: |-
  One of the best vertically integrated small manufactures.

  Particular strengths include resonance, twin regulators, constant-force architecture, visible movement design and significant internal component production.

  The Mirrored Force Resonance is the key mechanical calling card.

  April 2026 Watches & Wonders brought the flagship Minute Repeater Resonance 12:59 First Edition (cal. ARR25), the brand's most complex resonance piece to date; 2026 also added Mirrored Force Resonance Ruby (5 pc), Red (15 pc) and Ice Blue editions plus a Tribute2 Aurum limited edition.
