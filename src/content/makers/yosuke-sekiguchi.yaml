doc_heading: Yosuke Sekiguchi
body: |-
  Yosuke Sekiguchi is a Japanese watchmaker with an atelier in Le Locle, where he has lived for about two decades. His path was unconventional: refused admission to the school in Morteau, he learned by having a friend relay each lesson, was hired regardless by Manufacture La Joux-Perret where he worked on split-seconds, foudroyante and tourbillon, then moved to Christophe Claret for complicated work and to Juval Horlogerie for restoration. He launched his own name in 2020.

  His single model, the Primevère, is built around a movement he designed and makes component by component in his own atelier. The architecture reconstructs the 19th-century Jules Jürgensen pocket watch calibre, initially carved directly into steel without drawings, then measured back into construction plans once the prototype worked. Escapement, plates, bridges, wheels and the hand-made grand feu enamel dial are his work, in a line of practice much closer to Smith or Kikuno than to any brand with a proprietary calibre. Production is about twenty watches a year, and the order book runs full, closed around 2028 at the last report.

  Why Tier D, knocking on Tier C, and A3.5 / M4.5: on manufacture he is nearly a purist, one of the closest matches to the Japanese handmade tradition working in Switzerland today. The movement is a faithful revival of someone else's 19th-century architecture rather than a fully original design, which is what keeps authorship at 3.5. Recognition is the remaining gap: early press in 2022 and 2023, a Phillips Hong Kong appearance in 2025, and a closed order book, but no prize trail yet. The trajectory resembles Kikuno's position five years ago.
