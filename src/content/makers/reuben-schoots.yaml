doc_heading: Reuben Schoots
body: |-
  Schoots' story is exceptionally attractive: largely self-taught and heavily influenced by George Daniels' methods.

  Series Two is his first watch where Schoots himself designs and manufactures the case as well as the dial, hands and substantial portions of the movement. His own documentation lists internally produced mainplate, bridges, steel cocks, screws, clickwork, dial components, hands, case and crown.

  The remaining caveat is important: Series Two still uses an existing gear train and escapement, modified and finished by Schoots.

  Why I like him: every generation is moving further toward complete manufacture.
  Collector thesis: you are buying the trajectory as much as Series Two itself.

  Update August 2026: Series Two has now sold out, and Schoots is a semifinalist for the 2026 Louis Vuitton Watch Prize.
