doc_heading: Habring²
body: |-
  Richard and Maria Habring deserve much more respect than the prices suggest.

  The A11 movement family was developed as an independent movement platform, deliberately retaining some historical dimensional compatibility but no longer simply being an ETA or Valjoux modification.

  Habring² has produced deadbeat seconds, jumping seconds, split seconds, tourbillons and chronographs.
  Value: outstanding.
