doc_heading: Romain Gauthier
body: |-
  One of the strongest manufactures on the entire list.

  Gauthier began with his own Prestige HM/HMS calibres and subsequently built Logical One, Insight Micro-Rotor, Continuum and highly sophisticated internal component capability.

  Gauthier's manufacturing business is itself capable of producing highly difficult components for other prestigious makers.

  Why important: combines Dufour-level finishing ambition with serious engineering and manufacturing depth.
  Classification: borderline Tier S.
