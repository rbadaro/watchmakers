doc_heading: Vincent Deprez
body: |-
  Vincent Deprez works near Geneva and came to independence from a decade of high-end restoration for the biggest houses, including time inside Vacheron Constantin and Patek Philippe restoration departments. He came to wider attention in 2025 when Dutch and Swiss press profiled his first independent watch, a traditionally constructed tourbillon made almost entirely without computer-controlled machines.

  The construction is unusually complete for a debut: his own one-minute tourbillon architecture, his own case made in his workshop, and grand feu enamel dials executed in the traditional manner by the atelier itself. Fabrication runs on pedal lathes, jig borers and traditional machines rather than CNC, which is the highest point of manufacture practice among the new Swiss entries this year. Output is a handful of watches per year, priced on request.

  Why Tier D and A4 / M4.5: the movement is his own architecture and the physical manufacture, case included, is almost entirely in-house, which is why he sits at the very top of this tier on day one. What keeps him out of Tier C for now is the base of recognition: one reference, one point of contact, no prize or auction record yet. If a second construction sustains the same level, the C discussion is immediate.
