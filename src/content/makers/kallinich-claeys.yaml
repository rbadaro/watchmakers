doc_heading: Kallinich Claeys
body: |-
  A young German atelier with a strong Saxon visual and mechanical vocabulary.

  The founding Einser series was tiny, and Louis Vuitton Watch Prize semi-final status means awareness is rising.

  Strength: excellent movement finishing and coherent design.
  Watchpoint: determine how much future movement manufacturing moves internally rather than merely how refined the finishing becomes.
