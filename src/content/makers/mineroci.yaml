doc_heading: Mineroci
body: |-
  Mineroci is one of the more interesting representatives of the new Chinese haute-horlogerie movement.

  The RD002 combines remontoire, deadbeat seconds, highly symmetrical movement architecture and extremely small production.

  Western collectors are only beginning to treat Chinese independent watchmaking as something beyond inexpensive tourbillons.

  Collector thesis: asymmetric exposure to a potentially important new national independent-watchmaking ecosystem.
  Risk: long-term brand recognition is harder to predict than for the Swiss and Japanese names.

  Update August 2026: Mineroci is a semifinalist for the 2026 Louis Vuitton Watch Prize.
