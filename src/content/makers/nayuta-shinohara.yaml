doc_heading: Nayuta Shinohara
body: |-
  Shinohara's Model A / Nayuta Model sits within the Masa & Co. ecosystem.

  The watch uses a hand-wound movement with a very large balance and an unusually artisanal presentation.

  Important caveat: available descriptions differ as to precisely how much inherited or base architecture remains, so an M5 score would be premature until the provenance of every major train and component is clearer.

  Collector thesis: interesting, but best approached through the broader Masa & Co. relationship rather than as a completely separate portfolio bet.

  Update August 2026: Shinohara won the tenth A. Lange & Söhne Walter Lange Watchmaking Excellence Award in 2020; no later edition of the prize has been confirmed since.
