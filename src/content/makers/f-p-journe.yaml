doc_heading: F.P. Journe
body: |-
  Journe is unique because he combined the intellectual inventiveness of a one-man independent with enough scale to build a genuine manufacture.

  His Invenit et Fecit philosophy explicitly means 'invented and made'. Essential movement families include Tourbillon Souverain, Chronomètre à Résonance, Chronomètre Optimum, Sonnerie Souveraine, Octa, Centigraphe and FFC.

  Why canonical: arguably the most important independent movement inventor of the last generation.
