doc_heading: Moritz Grossmann
body: |-
  A genuine Glashütte calibre manufacture.

  Strengths include distinctive German movement architecture, proprietary balance systems, exceptional hand work and unusual winding and reset mechanisms.

  Far less collector hype than Lange despite very serious watchmaking.
