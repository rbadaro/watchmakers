doc_heading: Niton
body: |-
  The revived Niton is better thought of as a tiny independent manufacture than a single bench watchmaker.

  The Prima uses a proprietary form movement with jumping hour, striking hour, zero reset and Geneva Seal certification. Only 38 pieces were planned for the initial series.

  Interesting mechanically, but it belongs more naturally beside small manufactures than Ohno or Birchall-style craftsmen.
