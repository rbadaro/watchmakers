doc_heading: Sylvain Berneron
body: |-
  Berneron's Mirage is one of the most aesthetically coherent young independents.

  But it is important not to confuse authorship with manufacture. The movement was developed alongside specialist movement constructors rather than wholly produced at Berneron's bench.

  Why care: movement architecture, case and dial form an unusually integrated whole.
  Collector status: already extremely hot.
  Movement-first view: less pure than Cools, Pinaud or Pagès.
